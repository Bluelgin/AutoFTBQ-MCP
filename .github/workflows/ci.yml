name: build

on:
  push:
  pull_request:

jobs:
  forge-1-20-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'
      - run: gradle build --stacktrace
